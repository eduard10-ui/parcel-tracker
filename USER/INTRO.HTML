<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ==================== META SETTINGS ==================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==================== PAGE TITLE ==================== -->
    <title>Intro</title>
  </head>

  <body>
    <!-- ==================== HEADER TEXT ==================== -->
    <p id="welcome">HELLO! , WELCOME TO</p>
    <p id="logo_name">PARCEL TRACKER</p>
    <p id="logo_subname">PARCEL TRACKING SYSTEM</p>

    <!-- ==================== START BUTTON ==================== -->
    <button id="start" onclick="start()">START</button>
  </body>

  <!-- ==================== START FUNCTION ==================== -->
  <script>
    function start() {
      window.location.href = "REGISTER.PHP";
    }
  </script>

  <!-- ==================== INTERNAL CSS ==================== -->
  <style>
    /* ==================== GLOBAL RESET ==================== */
    * {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      transition: all 0.3s ease;
    }

    /* ==================== BODY STYLES ==================== */
    body {
      background: #010d00;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      flex-direction: column;
      background: linear-gradient(
        135deg,
        #010d00 0%,
        #072b03 50%,
        #010d00 100%
      );
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    /* ==================== BODY OVERLAY ==================== */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      background: radial-gradient(
        circle at center,
        transparent 0%,
        rgba(1, 13, 0, 0.8) 100%
      );
      z-index: -1;
      pointer-events: none;
    }

    /* ==================== BACKGROUND ANIMATION ==================== */
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* ==================== WELCOME TEXT ==================== */
    #welcome {
      font-size: 33px;
      font-weight: bolder;
      font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      color: rgb(214, 241, 169);
      margin: 0;
      margin-bottom: -25px;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(214, 241, 169, 0.4);
    }

    /* ==================== MAIN TITLE ==================== */
    #logo_name {
      color: white !important;
      font-size: 85px;
      letter-spacing: 0px;
      font-weight: bolder;
      margin: 0;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    }

    /* ==================== SUB TITLE ==================== */
    #logo_subname {
      z-index: 10;
      pointer-events: none;
      opacity: 0.9;
      color: rgb(139, 204, 131);
      font-size: 50px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      margin-top: -30px;
    }

    /* ==================== START BUTTON ==================== */
    #start {
      padding: 8px 65px;
      border-radius: 50px;
      margin: 10px;
      font-weight: bolder;
      font-size: 25px;
      background: rgba(32, 77, 30, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgb(150, 238, 162);
      letter-spacing: 3px;
      border: 1px solid rgba(150, 238, 162, 0.3);
      font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* ==================== BUTTON HOVER ==================== */
    #start:hover {
      background: rgba(32, 77, 30, 0.9);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px 0 rgba(5, 14, 6, 0.2);
      letter-spacing: 5px;
      border: 1px solid rgba(22, 71, 28, 0.8);
    }

    /* ==================== BUTTON CLICK ==================== */
    #start:active {
      transform: translateY(1px);
    }
  </style>
</html>
